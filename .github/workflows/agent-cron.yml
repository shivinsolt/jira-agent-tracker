name: Daily Agentic Tracker

on:
  schedule:
    # Runs at 13:30 UTC every day (9:30 AM EDT)
    - cron: '30 13 * * *'
  workflow_dispatch: # Allows you to manually trigger it from the GitHub UI for testing

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for GCP cloud authentication

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # Authenticate with Google Cloud using a Service Account JSON secret or Workload Identity
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }} # Optional: Leave out if using workload identity, or add your GCP service account JSON key as a secret

      - name: Execute Daily Report
        env:
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_URL: ${{ secrets.JIRA_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OUTLOOK_EMAIL: ${{ secrets.OUTLOOK_EMAIL }}
          GOOGLE_GENAI_USE_VERTEXAI: ${{ secrets.GOOGLE_GENAI_USE_VERTEXAI }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION: ${{ secrets.GOOGLE_CLOUD_LOCATION }}
        run: node jira-client.js